<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->

    <meta
      name="description"
      content="Suzy Liu is a California-based portrait and editorial photographer crafting minimal, calm, and intentional imagery. Book a session or explore the portfolio."

      href="/src/assets/fonts/inter-latin-300-600.woff2"

      type="font/woff2"
